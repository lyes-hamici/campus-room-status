spring:
  application:
    name: room-status
  cache:
    cache-names:
      - buildings
      - rooms
      - room-details
      - room-schedules

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  google:
    enabled: false
    customer: my_customer
    registration-id: google
    time-zone: Europe/Paris

  campus:
    rooms:
      - code: AMPHI-A
        name: Amphithéâtre A
        calendar-id: amphi-a@group.calendar.google.com
        building-id: BAT-A
        building-name: Bâtiment A - Informatique
        address: 10 rue de l'Innovation
        floor: "1"
        capacity: 150
        type: Cours magistral
        maintenance: false

      - code: LAB-INFO-1
        name: Laboratoire Informatique 1
        calendar-id: lab-info-1@group.calendar.google.com
        building-id: BAT-A
        building-name: Bâtiment A - Informatique
        address: 10 rue de l'Innovation
        floor: "2"
        capacity: 30
        type: TP
        maintenance: false

      - code: LAB-INFO-2
        name: Laboratoire Informatique 2
        calendar-id: lab-info-2@group.calendar.google.com
        building-id: BAT-A
        building-name: Bâtiment A - Informatique
        address: 10 rue de l'Innovation
        floor: "2"
        capacity: 24
        type: TP
        maintenance: false

      - code: MEETING-B1
        name: Salle de réunion B1
