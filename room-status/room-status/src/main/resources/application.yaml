spring:
  application:
    name: room-status
  config:
    import: optional:file:.env[.properties]
  cache:
    cache-names:
      - buildings
      - rooms
      - room-details
      - room-schedules
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID:}
            client-secret: ${CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/admin.directory.resource.calendar.readonly

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  google:
    enabled: true
    application-name: room-status
    customer: my_customer
    delegated-user: ${GOOGLE_DELEGATED_USER:}
    service-account-key-path: ${GOOGLE_SERVICE_ACCOUNT_KEY_PATH:}
    time-zone: Europe/Paris
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    max-results-per-page: 100
